<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Example 3</title>
  <style>
    .square {
      width: 100px;
      height: 100px;
      background-color: skyblue;
    }
    .circle {
      width: 100px;
      height: 100px;
      background-color: pink;
      border-radius: 50%;
      text-align: center;
      line-height: 100px;
    }
  </style>
</head>
<body>
  <h1> box shapes  & circles </h1>
  <div class="square">Square</div>
  <div class="circle">Circle</div>
</body>
</html>
