<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Example 5</title>
  <style>
    .moving-box {
      width: 100px;
      height: 100px;
      background-color: orange;
      position: relative;
      animation: move 3s infinite alternate;
    }

    @keyframes move {
      from { left: 0; }
      to { left: 200px; }
    }
  </style>
</head>
<body>
  <h1>CSS Animation Example</h1>
  <div class="moving-box"></div>
</body>
</html>
