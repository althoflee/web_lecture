<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ex01 sample chat</title>
    <style>
        @import url('./main.css');
    </style>
</head>
<body>
    <script type="module">
        import main from './index.js'
        main();
    </script>

    <div id="main">

        <!-- 시스템 프롬프트 입력 -->
        <label for="inp-prompt">시스템 프롬프트:</label>
        <input id="inp-prompt" type="text" placeholder="프롬프트를 입력하세요 (예: 당신은 친절한 비서입니다)" style="width: 400px;" /> 

        <!-- 사용자 질문 입력 -->
        <label for="inp-msg">질문:</label>  
        <input id="inp-msg" type="text" placeholder="질문을 입력하세요..." style="width: 300px;" />

        <button id="send-btn">Send</button>

        <p id="response"></p>

    </div>
    

</body>
</html>
